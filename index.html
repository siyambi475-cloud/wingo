<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HGZY Demo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:400px;
background:#1e293b;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#facc15;
margin-bottom:20px;
}

.tabs{
display:flex;
margin-bottom:20px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
cursor:pointer;
background:#334155;
color:white;
}

.tabs button.active{
background:#facc15;
color:black;
font-weight:bold;
}

.form{
display:none;
}

.form.active{
display:block;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:none;
border-radius:8px;
background:#334155;
color:white;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#facc15;
font-weight:bold;
cursor:pointer;
}

.msg{
margin-top:10px;
text-align:center;
color:#22c55e;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">HGZY DEMO</div>

<div class="tabs">
<button class="active" onclick="showLogin()">Login</button>
<button onclick="showRegister()">Register</button>
</div>

<div id="loginForm" class="form active">

<input type="email" id="loginEmail" placeholder="Email">

<input type="password" id="loginPassword" placeholder="Password">

<button class="btn" onclick="login()">
Login
</button>

</div>

<div id="registerForm" class="form">

<input type="text" id="username" placeholder="Username">

<input type="email" id="registerEmail" placeholder="Email">

<input type="password" id="registerPassword" placeholder="Password">

<button class="btn" onclick="register()">
Register
</button>

</div>

<div class="msg" id="message"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){

const email =
document.getElementById("registerEmail").value;

const password =
document.getElementById("registerPassword").value;

createUserWithEmailAndPassword(auth,email,password)

.then(()=>{
document.getElementById("message").innerText =
"Registration Successful";
})

.catch(err=>{
document.getElementById("message").innerText =
err.message;
});

}

window.login = function(){

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

signInWithEmailAndPassword(auth,email,password)

.then(()=>{
window.location.href="home.html";
})

.catch(err=>{
document.getElementById("message").innerText =
err.message;
});

}

</script>

<script>

function showLogin(){

document.getElementById("loginForm")
.classList.add("active");

document.getElementById("registerForm")
.classList.remove("active");

document.querySelectorAll(".tabs button")[0]
.classList.add("active");

document.querySelectorAll(".tabs button")[1]
.classList.remove("active");

}

function showRegister(){

document.getElementById("registerForm")
.classList.add("active");

document.getElementById("loginForm")
.classList.remove("active");

document.querySelectorAll(".tabs button")[1]
.classList.add("active");

document.querySelectorAll(".tabs button")[0]
.classList.remove("active");

}

</script>

</body>
</html>
